[Settings]
; FSR3 - Nvidia & AMD GPU, DLAA - RTX Only, XeSS - Intel & any GPU
; 1 - FSR3, 2 - DLAA, 3 - XeSS, 0 - Off
iAAMode=1
; RCAS sharpness - 0.0 = no sharpening, 1.0 = max
fSharpness=0.5
; NVIDIA Reflex to reduce game latency (DLAA mode only)
bEnableReflex=1
bReflexBoost=0
; DLSS preset (DLAA mode only):
;   10 = J (Preset J might exhibit slightly less ghosting at the cost of extra flickering. Preset K is generally recommended over preset J)
;   11 = K (Default preset for DLAA mode that is transformer based. Best image quality preset at a higher performance cost)
iDLSSPreset=11

[Advanced]
; Reflex FPS limiter (DLAA mode only)
bReflexUseFPSLimit=0
fReflexFPSLimit=60
; -0.0001 = default safety net to preserve samplers from being overridden
;  0.0    = allowing other mods to override samplers
fAnisotropicMipBias=-0.0001

[ENB]
; ENB D3D11 proxy bypass offsets
; Only change if ENB updates and FSR3 stops working
DeviceOffset=0x28
ContextOffset=0x6C20
