[Settings]
; RCAS sharpness - 0.0 = no sharpening, 1.0 = max
; Applied on top, it may interfere with the presets below and thus produce excessive sharpening
fSharpness=0.5
; DLSS preset:
;   10 = J (Preset J might exhibit slightly less ghosting at the cost of extra flickering. Preset K is generally recommended over preset J)
;   11 = K (Default preset for DLAA mode that is transformer based. Best image quality preset at a higher performance cost)
;   12 = L (Delivers a sharper, more stable image with less ghosting than Preset J, K but are more expensive performance wise)
;   13 = M (Delivers similar image quality improvements as Preset L but closer in speed to Presets J, K)
iDLSSPreset=11

[Advanced]
; -0.0001 = default safety net to preserve samplers from being overriden
;  0.0    = allowing other mods to override samplers
fAnisotropicMipBias=-0.0001
